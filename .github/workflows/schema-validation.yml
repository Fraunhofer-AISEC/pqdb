name: JSON Schema Validation

on: [push, pull_request]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: |
        cd tools/validation
        npm install
    - name: Run validation
      run: node tools/validation/validate.js
      env:
        CI: true
