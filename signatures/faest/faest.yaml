name: FAEST
description: >-
  Signature scheme that uses VOLE in the Head and QuickSilver to
  prove knowledge of a preimage of an AES based one way function. Its FAEST EM
  variants use the Even Mansour construction with AES or Rijndael.
category: other
category comment: >-
  The construction uses VOLE in the Head rather than MPC in the Head.
status:
  - process: nist-additional-sigs
    stage: '3'
    year: 2026
