problems:
  - assumption: AES one wayness and pseudorandomness
    comment: >-
      The main FAEST variants use AES based one way functions and AES in counter
      mode as a pseudorandom generator.
  - assumption: VOLE in the Head and QuickSilver security
    comment: >-
      The signature derives from a noninteractive argument of knowledge built
      from VOLE in the Head and QuickSilver.
  - assumption: Even Mansour one wayness
    comment: >-
      The FAEST EM variants assume that the Even Mansour construction based on
      AES or Rijndael is hard to invert.
  - assumption: Almost injectivity of the IV based tweakable PRG
    comment: >-
      This additional nonstandard assumption is used only for FAEST EM to
      establish extractable binding.
trust comment: >-
  The specification proves EUF-CMA security in the random oracle model and the
  quantum accessible random oracle model. These proofs cover at most 2^64
  signing queries. Standard FAEST obtains statistical commitment binding in
  the random oracle model. FAEST EM additionally relies on almost injectivity
  of the IV based tweakable PRG and ideal permutation security of its Even
  Mansour construction. The specification reports no full round shortcut key
  recovery attacks that improve substantially on exhaustive search.
