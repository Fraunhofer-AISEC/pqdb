name: XMSS
description: A stateful hash-based scheme using Merkle tree approach and Winternitz optimizations.
category: hash
stateful: true
status:
  - process: rfc
    stage: standardized
    standard: RFC 8391
    url: https://www.rfc-editor.org/rfc/rfc8391
    year: 2018
  - process: nist-sp
    stage: standardized
    standard: NIST SP 800-208
    url: https://doi.org/10.6028/NIST.SP.800-208
    year: 2020
year:
    paper: 2011
    standardization: 2018
authors:
  - Andreas Hülsing
  - Denis Butin
  - Stefan-Lukas Gazdag
  - Joost Rijneveld
  - Aziz Mohaisen
problems comment: "Only properties of hash functions assumed. This is implicitly assumed by all schemes, so we don't list it explicitly here."
trust comment: >-
  Very high because of minimal assumptions. It relies only on the collision resistance of the hash
  function applied to the message itself.
sources:
  - Original paper (https://eprint.iacr.org/2011/484)
  - Paper, for public key size (https://eprint.iacr.org/2017/349)
  - RFC 8391 (https://www.rfc-editor.org/rfc/rfc8391)
  - NIST SP 800-208 (https://doi.org/10.6028/NIST.SP.800-208)
