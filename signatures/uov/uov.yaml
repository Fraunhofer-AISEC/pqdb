name: UOV
description: >-
  A multivariate hash and sign scheme built from a trapdoored
  Unbalanced Oil and Vinegar quadratic map. It supports expanded and compressed
  key representations.
category: multivariate
status:
  - process: nist-additional-sigs
    stage: '3'
    year: 2026
year:
  paper: 1999
  candidate: 2023
authors:
  - Ward Beullens
  - Ming-Shing Chen
  - Jintai Ding
  - Boru Gong
  - Matthias J. Kannwischer
  - Jacques Patarin
  - Bo-Yuan Peng
  - Dieter Schmidt
  - Cheng-Jhih Shih
  - Chengdong Tao
  - Bo-Yin Yang
problems:
  - assumption: UOV problem
    comment: >-
      Security relies on the difficulty of inverting a trapdoored multivariate
      quadratic UOV map without knowledge of its oil space.
trust comment: >-
  UOV has received more than twenty years of cryptanalysis. The specification
  evaluates collision, direct, Kipnis Shamir, intersection, MinRank, and wedge
  attacks. It does not provide a reduction from a standard problem for the
  recommended construction.
website: https://www.uovsig.org/
sources:
