name: MQOM
description: >-
  "MQ on my Mind." A Fiat-Shamir signature scheme built from an MPC-in-the-Head
  proof for random multivariate quadratic systems, using Shamir secret sharing
  over GGM seed trees.
category: mpc-in-the-head
year:
  candidate: 2023
  comment: >-
    This document specifies MQOM v2.1 dated 2025-09-22. The first version was
    submitted in 2023.
authors:
  - Ryad Benadjila
  - Charles Bouillaguet
  - Thibauld Feneuil
  - Matthieu Rivain
problems:
  - assumption: Random multivariate quadratic (MQ) problem over F2, F16 and F256
stateful: false
status:
  - process: nist-additional-sigs
    stage: '3'
    year: 2026
    comment: >-
      MQOM advanced to Round 3 of the NIST additional digital signature
      standardization process on 2026-05-14.
trust comment: >-
  The scheme relies on a fully random MQ instance with no trapdoor structure,
  which is considered a conservative assumption. A formal EUF-CMA proof in the
  ROM and ICM is announced for a future version.
website: https://mqom.org
sources:
  - Specification, version 2.1 (https://mqom.org/docs/mqom-v2.1.pdf)
last_updated: '2025-09-22'
