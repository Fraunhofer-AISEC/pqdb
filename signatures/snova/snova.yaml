name: SNOVA
description: >-
  A multivariate signature scheme derived from Unbalanced Oil and
  Vinegar over noncommutative matrix rings with randomness alignment. It
  supports rectangular signatures and base fields of odd characteristic.
category: multivariate
year:
  paper: 2022
  candidate: 2023
authors:
  - Lih-Chung Wang
  - Chun-Yen Chou
  - Jintai Ding
  - Hao Guo
  - Yen-Liang Kuan
  - Jan Adriaan Leegwater
  - Ming-Siou Li
  - Peigen Li
  - Bo-Shu Tseng
  - Po-En Tseng
  - Chia-Chun Wang
stateful: false
status:
  - process: nist-additional-sigs
    stage: '3'
    year: 2026
problems:
  - assumption: Multivariate quadratic problem
    comment: >-
      Security is assessed through forgery and key recovery attacks against the
      UOV structure induced by the SNOVA public map.
trust comment: >-
  The public map was reformulated in Round 3 in response to cryptanalysis of
  the Round 1 and Round 2 submissions. The specification states that the
  security of SNOVA is supported by cryptanalytic evidence rather than by a
  formal reduction for the noncommutative cases. The recommended parameter sets
  were selected conservatively with substantial security margins.
website: https://snova.pqclab.org
sources:
