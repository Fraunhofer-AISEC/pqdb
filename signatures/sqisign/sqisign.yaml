name: SQIsign
description: >-
  An isogeny-based Fiat-Shamir signature scheme proving knowledge of a supersingular
  elliptic-curve endomorphism, with security based on the endomorphism ring problem.
comment: >-
  Only isogeny-based family in the NIST additional-signatures process. The
  round-2 submission integrates the SQIsign2D-West improvements [BDD+24],
  yielding ~20x faster signing and ~14% smaller signatures at level I vs round 1.
category: isogeny
category comment: >-
  Elliptic-curve isogeny scheme; security rests on the endomorphism ring problem
  (equivalent to the supersingular isogeny path problem under polynomial-time
  reductions).
