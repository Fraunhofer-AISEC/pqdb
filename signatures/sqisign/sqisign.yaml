problems:
  - assumption: Endomorphism ring problem for supersingular elliptic curves
    comment: >-
      Equivalent to the supersingular isogeny path problem under polynomial-time
      reductions [EHL+18, Wes22]. EUF-CMA security is proven under a "hint"
      variant of the endomorphism ring problem (q-sim-hint-OneEndp,
      q-unif-hint-OneEndp, q-unif-hint-EndRingp).
trust comment: >-
  Not affected by the polynomial-time SIDH attacks [CD23, MMP+23, Rob23], which
  targeted an easier variant of the isogeny problem. The round-3 submission
  redesigns quaternion arithmetic using an inert representation and
  fixed-precision integers, removes the GMP/DPE dependencies, and adopts a new
  ideal-to-isogeny algorithm [BCE+25, DLS26]. These changes accelerate key
  generation and signing, but the response to the attack [Wes26] required larger
  parameters, resulting in 1.5-2x slower verification and larger keys and
  signatures. Primes are chosen "nothing up my sleeve", with no known security
  impact beyond arithmetic speedups, as with SIKE's special primes. The critical
  curves E_pk and E_com are uniformly distributed, leveraging a
  worst-case-to-average-case reduction of the endomorphism ring problem.
