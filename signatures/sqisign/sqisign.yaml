problems:
  - assumption: Endomorphism ring problem for supersingular elliptic curves
    comment: >-
      Equivalent to the supersingular isogeny path problem under polynomial-time
      reductions [EHL+18; Wes22]. EUF-CMA security is proven under a "hint"
      variant of the endomorphism ring problem (q-sim-hint-OneEndp,
      q-unif-hint-OneEndp, q-unif-hint-EndRingp).
trust comment: >-
  Not affected by the polynomial-time SIDH attacks [CD23; MMP+23; Rob23], which
  targeted an easier variant of the isogeny problem. Primes are chosen "nothing
  up my sleeve" with no known security impact beyond arithmetic speedups (as with
  SIKE's special primes). The critical curves E_pk and E_com are uniformly
  distributed, leveraging a worst-case to average-case reduction of the
  endomorphism ring problem.
