name: broadwell
platform: desktop
type: optimized
comment: Assembly-optimized implementation targeting Intel Broadwell (and later). The assembly optimizations are applied to the finite-field arithmetic in the gf module; the rest of the code base is reused from the reference implementation (build type broadwell). Uses SHAKE256 for hashing and PRNG (FIPS 202), with no external libraries.
side channel guarding:
  timing: false
  timing comment: Not constant-time overall; the finite-field arithmetic is implemented in constant-time (Section 8.5).
platform comment: x86-64
