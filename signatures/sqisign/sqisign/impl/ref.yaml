name: ref
platform: c
type: reference
comment: >-
  Portable C11 reference implementation; the "optimized" implementation is
  identical to the reference implementation (Section 7.3). The 64-bit ARM build
  reuses the same plain-C field arithmetic and accelerates the AES256-CTR-DRBG
  via ARM Cryptographic Extensions.
side channel guarding:
  timing: false
  timing comment: >-
    Implementations do not run in constant-time. However, a significant portion
    of the finite-field, elliptic-curve, pairing and isogeny arithmetic is
    implemented in constant-time; Pornin's inversion and Legendre-symbol
    algorithms are constant-time.
dependencies:
  - GMP (arbitrary-precision integers, quaternion module)
  - DPE (floating-point arithmetic, quaternion module)
