name: MAYO
description: >-
  An Oil and Vinegar multivariate quadratic signature scheme over F16, using a
  publicly expanded map to keep public keys small and signatures short.
category: multivariate
year:
  paper: 2021
  candidate: 2023
authors:
  - Ward Beullens
  - Fabio Campos
  - Sofía Celi
  - Basil Hess
  - Matthias J. Kannwischer
stateful: false
problems:
  - assumption: Oil and Vinegar problem
    comment: >-
      Distinguishing a multivariate quadratic map that vanishes on a secret
      subspace of dimension o from a uniformly random multivariate quadratic map.
  - assumption: Multi-target whipped MQ problem
    comment: >-
      Multi target preimage resistance of the whipped map built from a random
      multivariate quadratic map with the public E matrices.
problems comment: >-
  The specification gives a tight reduction from these two problems to EUF-CMA
  security in the random oracle model.
trust comment: >-
  MAYO public keys have the same structure as Oil and Vinegar public keys, so the
  cryptanalysis of Oil and Vinegar since 1997 applies to key recovery. Security
  against forgery additionally relies on the whipped multivariate quadratic
  problem, which has received less public scrutiny. The round 2 parameters
  satisfy n minus o at least m, which prevents the rectangular MinRank attack of
  Furue and Ikematsu, and they keep a margin of 10, 15 and 20 bits of security
  against system solving attacks for security levels 1, 3 and 5.
status:
  - process: nist-additional-sigs
    stage: '3'
    year: 2026
    comment: >-
      MAYO advanced through round 1 (2023) and round 2 (2024) of the NIST
      additional signature schemes process and was selected for round 3 in 2026.
      The extracted data comes from the round 2 version of the specification.
website: https://pqmayo.org/
links:
