name: MAYO-5
comment: 'Parameters (n, m, o, k, q) = (154, 142, 12, 12, 16) with f142(z).'
security level:
  classical: 296
  quantum: 148
  nist category: 5
  comment: >-
    The specification reports bit complexity lower bounds of 546 for the Kipnis
    Shamir attack, 334 for the reconciliation attack, 629 for the intersection
    attack, 296 for the direct attack and 298 for claw finding. The classical
    value is the smallest of these. The quantum value follows the statement that
    known quantum attacks improve on classical attacks by at most a square root
    factor.
failure probability: 0
failure probability comment: >-
  Signing never fails. The linear system is not of full rank with probability
  about 2 to the power minus 12, in which case signing restarts with a new
  counter value.
number of operations: inf
sizes:
  sk: 40
  pk: 5554
  ct|sig: 964
  comment: >-
    Secret key and public key sizes are for the compact representations. The
    expanded secret key is 822 KB and the expanded public key is 828 KB.
