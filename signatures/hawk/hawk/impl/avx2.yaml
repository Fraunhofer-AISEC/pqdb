name: AVX2
comment: Optimised C implementation using x86 AVX2 intrinsics (e.g. four parallel SHAKE256 instances in SHAKE256x4). Isochronous and free of floating-point arithmetic. Used for the x86 "Coffee Lake" benchmarks.
platform: desktop
type: optimized
side channel guarding:
  branching: true
  timing: true
  branching comment: Constant-time design. See [GR24] for power-analysis considerations on the Gaussian sampler.
  timing comment: 'Isochronous: running time of secret-dependent functions is independent of the secret data.'
hardware features:
  - AVX2
links:
  - https://github.com/hawk-sign/
