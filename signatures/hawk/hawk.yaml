last_updated: '2026-08-27'
last_updated comment: >-
  Updated to record the 2026 key recovery attack by Straznickas and Weis, the
  reduced security levels of all parameter sets, and the withdrawal of HAWK from
  the NIST Additional Signatures process on 29 July 2026.
