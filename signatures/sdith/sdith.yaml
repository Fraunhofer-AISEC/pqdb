problems:
  - assumption: Syndrome decoding for random binary linear codes
    comment: >-
      The specification presents this problem as the presumably hardest problem of
      code based cryptography and as NP-hard.
  - assumption: Regular syndrome decoding
    comment: >-
      The used instances admit a proven reduction from unstructured syndrome
      decoding, and the parameters compensate the loss of that reduction.
problems comment: >-
  Security statements are given in the random oracle model for the hash function
  and in the ideal cipher model for the block cipher.
trust comment: >-
  The specification argues for a conservative choice by relying on unstructured
  binary syndrome decoding, whose cryptanalysis has been stable for decades.
  Security estimates use the Syndrome Decoding Estimator with a logarithmic memory
  access cost and a bounded memory size. A formal proof of EUF-CMA security is
  announced for a future version of the document. A preprint claiming shorter
  signatures through a different modeling of syndrome decoding appeared shortly
  before the submission deadline and has not yet been evaluated by the team.
