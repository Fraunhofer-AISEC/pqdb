name: SDitH
description: >-
  "SD-in-the-Head." A Fiat-Shamir signature scheme built from a VOLE-in-the-Head
   proof for binary syndrome decoding, using tensor-product representations to keep
   low-weight witnesses small.
comment: >-
  The specification also outlines three optional variants that are not formal
  instances, namely a variant over the field F256, a variant based on the
  Threshold-Computation-in-the-Head framework and a simple variant without the
  one-tree optimization and without grinding.
category: mpc-in-the-head
stateful: false
